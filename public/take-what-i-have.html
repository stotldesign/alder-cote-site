class C0 extends DCLogic {
  constructor(props) { super(props); this.state = { sound: false, t: 0, dim: 0, y: 0 }; }
  renderVals() {
    const ch = [], DUR = 1, on = this.state.sound, o = {};

    o.main = (el) => { if (!el || this.v === el) return; this.v = el;
      el.addEventListener('timeupdate', () => { if (Math.abs(el.currentTime - this.state.t) > 0.2) this.setState({ t: el.currentTime }); }); };
    o.px = (Math.min(1, this.state.t / DUR) * 1440).toFixed(1); o.tc = tc(this.state.t);
    ch.forEach((s, i) => { o['go' + i] = () => { const v = this.v; if (v) { v.currentTime = s + 0.05; const p = v.play(); if (p && p.catch) p.catch(() => {}); } }; });
    o.scroll = (e) => { const y = e.target.scrollTop, d = Math.max(0, Math.min(0.62, (y - 160) / 560 * 0.62));
      if (Math.abs(d - this.state.dim) > 0.015 || (y > 40) !== (this.state.y > 40)) this.setState({ dim: d, y }); };
    o.dim = this.state.dim.toFixed(3); o.cue = this.state.y > 40 ? 0 : 1; o.topO = this.state.y > 40 ? 1 : 0;
    o.toggle = () => { const v = this.v; if (!v) return; v.muted = on; if (!on) { const p = v.play(); if (p && p.catch) p.catch(() => {}); } this.setState({ sound: !on }); };
    o.soundLab = on ? 'sound off' : 'sound on'; o.noteAnim = on ? 'hop .5s step-end infinite' : 'none'; o.strike = on ? 'none' : 'inline';
    [].forEach((i) => {
      o['cR' + i] = (el) => { this.c = this.c || {}; if (el) this.c[i] = el; };
      o['cIn' + i] = () => { const c = (this.c || {})[i]; if (!c) return; if (this.v && this.state.sound) this.v.muted = true;
        c.muted = false; const p = c.play(); if (p && p.catch) p.catch(() => { c.muted = true; c.play(); }); };
      o['cOut' + i] = () => { const c = (this.c || {})[i]; if (c) { c.pause(); c.muted = true; } if (this.v && this.state.sound) this.v.muted = false; };
    });
