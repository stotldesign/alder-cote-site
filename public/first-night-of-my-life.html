    o.main = (el) => { if (el) this.v = el; };
    // the frame: resting size from the window's height, then grown by scrolling until it is the whole background
    const A = 1.33333, RH = this.state.rh || 900, y = this.state.y;
    const mh = RH - 150, rw = Math.min(1260, mh * A), rhh = rw / A, rx = (1440 - rw) / 2, ry = 76 + (mh - rhh) / 2;
    const p = Math.max(0, Math.min(1, y / (RH * 0.5))), e = p * p * (3 - 2 * p);
    o.bx = (rx * (1 - e)).toFixed(1); o.by = (ry * (1 - e)).toFixed(1);
    o.bw = (rw + (1440 - rw) * e).toFixed(1); o.bh = (rhh + (RH - rhh) * e).toFixed(1);
    o.bb = (2 * (1 - e)).toFixed(2); o.dim = (0.5 * e).toFixed(3);
    o.scr = (el) => { if (el && el.clientHeight && Math.abs(el.clientHeight - RH) > 1) setTimeout(() => this.setState({ rh: el.clientHeight }), 0); };
    o.scroll = (ev) => { const t = ev.target.scrollTop; if (Math.abs(t - this.state.y) > 0.5) this.setState({ y: t }); };
    o.cue = y > 40 ? 0 : 1; o.topO = y > RH * 0.6 ? 1 : 0;
    // the book fits the window: its two pages and the turn link, under the top band
    const bS = Math.min(0.72, (RH - 86 - 120) / 1100); o.bookS = bS.toFixed(4); o.bookH = Math.round(1100 * bS + 24 + 72);
    o.leafDeg = f ? -180 : 0; o.turnLabel = f ? '←' : '→';
    o.flip = () => this.setState({ flipped: !f });
    o.stop = (e) => { if (e && e.stopPropagation) e.stopPropagation(); };
    o.toggle = () => { const v = this.v; if (!v) return; v.muted = on; if (!on) { const p = v.play(); if (p && p.catch) p.catch(() => {}); } this.setState({ sound: !on }); };
    o.hwheel = (e) => {   // over a sideways strip, a vertical scroll pans it until it reaches an end
      const el = e.currentTarget, d = e.deltaY || 0, max = el.scrollWidth - el.clientWidth;
      if (!d || Math.abs(e.deltaX) > Math.abs(d)) return;
      if ((d > 0 && el.scrollLeft < max - 1) || (d < 0 && el.scrollLeft > 1)) { e.preventDefault(); el.scrollLeft = Math.max(0, Math.min(max, el.scrollLeft + d)); }
    };
    o.soundLab = on ? 'sound off' : 'sound on'; o.noteAnim = on ? 'hop .5s step-end infinite' : 'none'; o.strike = on ? 'none' : 'inline';
    [0, 1, 2, 3].forEach((i) => {
      o['cR' + i] = (el) => { this.c = this.c || {}; if (el) this.c[i] = el; };
      o['cIn' + i] = () => { const c = (this.c || {})[i]; if (!c) return; if (this.v && this.state.sound) this.v.muted = true;
        c.muted = false; const p = c.play(); if (p && p.catch) p.catch(() => { c.muted = true; c.play(); }); };
      o['cOut' + i] = () => { const c = (this.c || {})[i]; if (c) { c.pause(); c.muted = true; } if (this.v && this.state.sound) this.v.muted = false; };
    });
    return o;
  }
}
