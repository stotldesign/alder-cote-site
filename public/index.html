<script>

class C0 extends DCLogic {
  renderVals() {
    const on = !!this.state.eyeOn;
    return {
      eyeO: on ? 1 : 0, eyeS: on ? 1 : 1.06,
      eyeRef: (el) => { if (!el || this.eye === el) return; this.eye = el;
        el.addEventListener('playing', () => { if (this.hov) this.setState({ eyeOn: true }); }); },
      eyeIn: () => { const e = this.eye; this.hov = true; if (!e) return; clearTimeout(this.tOut);
        if (!e.paused && !e.ended) { this.setState({ eyeOn: true }); return; }
        try { e.currentTime = 0; } catch (x) {} e.muted = false;
        const p = e.play(); if (p && p.catch) p.catch(() => { e.muted = true; e.play(); }); },
      eyeOut: () => { this.hov = false; this.setState({ eyeOn: false });
        clearTimeout(this.tOut); this.tOut = setTimeout(() => { if (!this.hov && this.eye) this.eye.pause(); }, 700); },
    };
  }
}

</script>
