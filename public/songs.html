</div></script>
<script>

class C0 extends DCLogic {
  constructor(props) { super(props); this.state = { sound: false }; }
  renderVals() {
    const on = this.state.sound;
    const set = (want) => { const v = this.v; if (!v) return;
      v.muted = !want; if (want) { const p = v.play(); if (p && p.catch) p.catch(() => {}); }
      this.setState({ sound: want }); };
    return {
      vid: (el) => { this.v = el; },
      soundLab: on ? 'sound off' : 'sound on',
      noteAnim: on ? 'hop .5s step-end infinite' : 'none',
      strike: on ? 'none' : 'inline',
      toggle: (e) => { if (e && e.stopPropagation) e.stopPropagation(); set(!on); },
      first: () => { if (!on && !this.asked) { this.asked = true; set(true); } },
    };
  }
}

</script>
<script>dcBoot(C0, "tpl0", 0);</script>
