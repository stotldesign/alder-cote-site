<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>you terrify me — Alder Cote</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<style>:root{--page:#FCFBF7;color-scheme:light}html,body{background:var(--page)}body{margin:0;overflow-x:hidden}#app{width:max-content;margin:0 auto}a{cursor:pointer}
body{margin:0}
.ob{position:absolute;font-family:Arial,Helvetica,sans-serif;font-size:15px;text-decoration:none;line-height:1;border:2px solid #111111;border-radius:50%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;white-space:nowrap;z-index:6}
.clip{position:absolute;overflow:hidden;cursor:url(./clef-cursor.png) 12 44, pointer}
.clip img.st{display:block;width:100%;height:100%;object-fit:cover}
.clip .vid{position:absolute;inset:0;opacity:0;pointer-events:none;overflow:hidden;background:#111111}
.clip .vid img{display:block;width:100%;height:100%;object-fit:cover;animation:flash .5s step-end infinite}
.clip .vid span{position:absolute;left:8px;bottom:8px;background:#111111;color:#FCFBF7;font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 6px}
.clip:hover .vid,.clip:active .vid{opacity:1}
@keyframes flash{0%{filter:invert(1);transform:scale(1.02)}25%{filter:contrast(2.4) grayscale(1);transform:translate(-6px,3px) scale(1.06)}50%{filter:none;transform:scale(1)}75%{filter:saturate(3) hue-rotate(40deg);transform:translate(5px,-4px) scale(1.08)}}
@keyframes hop{0%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
.hop{animation:hop .5s step-end infinite}
@keyframes draw{0%{stroke-dashoffset:1700}60%{stroke-dashoffset:0}100%{stroke-dashoffset:0}}
.draw path{stroke-dasharray:1700;animation:draw 5s steps(32) infinite}
.body p{margin:0 0 12px}


.sp .ph{position:absolute;background:#8E8A82;display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:url(./clef-cursor.png) 12 44, pointer}
.sp .ph.v{background:#5E5B55;color:#FCFBF7}
.sp .pic{position:absolute;overflow:hidden;cursor:url(./clef-cursor.png) 12 44, pointer}
.sp .pic img{width:100%;height:100%;object-fit:cover;display:block}
.sp .pic:hover img,.sp .ph:hover{animation:flash .5s step-end infinite}
.sp .cap{position:absolute;margin:0;font-family:Arial,Helvetica,sans-serif;font-size:10px;white-space:nowrap}
.sp .ly,.book .ly{position:absolute;margin:0;font-family:'Courier New',Courier,monospace;font-size:14px;line-height:1.55;white-space:pre}
.sp .vt,.book .vt{position:absolute;margin:0;writing-mode:vertical-rl;font-family:'Courier New',Courier,monospace;font-size:12px;letter-spacing:.08em}

.book{perspective:3200px}
.book .pg{position:absolute;top:0;width:680px;height:1100px;background:#FFFFFF;box-shadow:0 0 0 1px #DDDAD2}
.book .leaf{position:absolute;left:680px;top:0;width:680px;height:1100px;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s steps(9);z-index:5;cursor:pointer}
.book .face{position:absolute;inset:0;background:#FFFFFF;box-shadow:0 0 0 1px #DDDAD2;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.book .turn{position:absolute;bottom:-40px;font-family:'Courier New',Courier,monospace;font-size:13px;background:none;border:0;color:#0000EE;text-decoration:underline;cursor:pointer;padding:0}
.book .pg,.book .face{overflow:hidden}
@keyframes jit{0%{transform:translate(0,0)}25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,0)}}
.book .jit{display:inline-block;animation:jit .5s step-end infinite}

.wk{position:absolute;left:64px;width:1312px;background:#FFFFFF;border:1px solid #C8CCD1;box-sizing:border-box;padding:22px 44px 44px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.6;color:#111111;display:flow-root}
.wk a{color:#0000EE;text-decoration:none}
.wk a:hover{text-decoration:underline}
.wk a.v{color:#551A8B}
.wk a.new{color:#F2163C}
.wk b.self{font-weight:700}
.wk .tabs{display:flex;justify-content:space-between;font-size:12px;border-bottom:1px solid #C8CCD1;margin:0 -44px 18px;padding:0 44px 6px}
.wk .tabs span{margin-right:18px}
.wk .tabs .on{color:#111111;border-bottom:2px solid #111111;padding-bottom:5px}
.wk h1{font-family:'Times New Roman',Times,serif;font-weight:400;font-size:36px;line-height:1.2;margin:0;padding-bottom:4px;border-bottom:1px solid #A2A9B1}
.wk h1 .ns{color:#54595D}
.wk .from{font-size:12px;color:#54595D;margin:6px 0 4px}
.wk .hat{font-style:italic;padding-left:26px;margin:0 0 14px;font-size:13.5px}
.wk h2{overflow:hidden;font-family:'Times New Roman',Times,serif;font-weight:400;font-size:26px;line-height:1.3;margin:30px 0 10px;padding-bottom:2px;border-bottom:1px solid #A2A9B1}
.wk h3{font-size:15px;font-weight:700;margin:20px 0 6px}
.wk h2 .ed,.wk h3 .ed{font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:400;color:#54595D;margin-left:10px}
.wk p{margin:0 0 12px}
.wk sup{font-size:10px;line-height:0}
.wk .ph{width:100%;height:100%;background:#8E8A82;display:flex;align-items:flex-end;padding:10px;box-sizing:border-box;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.wk .ph.v{background:#5E5B55;color:#FCFBF7}
.wk .th{border:1px solid #C8CCD1;background:#F8F9FA;padding:3px;box-sizing:border-box}
.wk .th .im{display:block;width:100%;overflow:hidden;background:#FFFFFF;cursor:url(./clef-cursor.png) 12 44, pointer}
.wk .im img{width:100%;height:100%;display:block}
.wk .im:hover img,.wk .im:hover .ph{animation:flash .5s step-end infinite}
.wk .cp{display:flex;gap:6px;font-size:12px;line-height:1.45;padding:5px 3px 2px}
.wk .cp svg{flex:none;margin-top:3px}
.wk .toc{display:inline-block;border:1px solid #A2A9B1;background:#F8F9FA;padding:8px 18px 10px 14px;font-size:13px;margin:4px 0 8px}
.wk .toc b{display:block;text-align:center;margin-bottom:4px}
.wk .toc div{margin:2px 0}.wk .toc .n{color:#54595D;margin-right:6px}
.wk table.wt{border-collapse:collapse;background:#F8F9FA;border:1px solid #A2A9B1;font-size:13.5px}
.wk table.wt th,.wk table.wt td{border:1px solid #A2A9B1;padding:6px 10px;vertical-align:middle;text-align:left}
.wk table.wt th{background:#EAECF0;font-weight:700}
.wk .ib{float:right;width:420px;margin:0 0 18px 26px;border:1px solid #A2A9B1;background:#F8F9FA;padding:6px;box-sizing:border-box;font-size:13px;line-height:1.45}
.wk .ib .t{font-weight:700;font-size:17px;text-align:center;padding:4px 0 8px;font-style:italic}
.wk .ib .bar{background:#EAECF0;text-align:center;font-weight:700;padding:3px;margin:6px 0}
.wk .ib table{width:100%;border-collapse:collapse}
.wk .ib th{text-align:left;vertical-align:top;padding:3px 8px 3px 2px;width:38%}
.wk .ib td{padding:3px 2px}
.wk .cat{clear:both;border:1px solid #A2A9B1;background:#F8F9FA;padding:6px 10px;font-size:13px;margin-top:26px}
.wk .nav{clear:both;border:1px solid #A2A9B1;margin-top:30px;font-size:13px}
.wk .nav .h{background:#EAECF0;text-align:center;font-weight:700;padding:4px;position:relative}
.wk .nav .h span{position:absolute;right:10px;font-weight:400;font-size:12px}
.wk .nav .r{display:flex;border-top:2px solid #FFFFFF}
.wk .nav .r>div:first-child{background:#EAECF0;width:150px;text-align:right;padding:5px 12px;font-weight:700;flex:none}
.wk .nav .r>div+div{padding:5px 12px;background:#FFFFFF}
.wk .gal{display:flex;flex-wrap:wrap;gap:22px}
.wk .tile{width:384px}
.wk .tile .box{height:384px;border:1px solid #C8CCD1;background:#F8F9FA;display:flex;align-items:center;justify-content:center;padding:10px;box-sizing:border-box}
.wk .tile .box .im{width:100%;height:100%}
.wk .tile .fn{font-size:12.5px;margin-top:6px;word-break:break-all}
.wk .tile .meta{font-size:11.5px;color:#54595D}
.wk .sort{color:#A2A9B1;font-size:9px;margin-left:6px;letter-spacing:-1px}

.fg{font-family:Arial,Helvetica,sans-serif;color:#111111}
.fg .fgp{position:absolute;transform-origin:50% 50%;transition:transform .65s cubic-bezier(.32,.72,0,1),box-shadow .65s cubic-bezier(.32,.72,0,1);cursor:url(./clef-cursor.png) 12 44, pointer;will-change:transform;background:#FFFFFF}
.fg .fgp img,.fg .fgp video{width:100%;height:100%;object-fit:cover;display:block}
.fg .fgl{position:absolute;height:0;transform-origin:0 0;transition:left .65s cubic-bezier(.32,.72,0,1),top .65s cubic-bezier(.32,.72,0,1),width .65s cubic-bezier(.32,.72,0,1),transform .65s cubic-bezier(.32,.72,0,1),border-color .3s;z-index:1;pointer-events:none}
.fg .fgd{position:absolute;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;background:#111111;transition:left .65s cubic-bezier(.32,.72,0,1),top .65s cubic-bezier(.32,.72,0,1);z-index:30;pointer-events:none}
.fg .fgk{position:absolute;left:1122px;margin:0;font-size:11px;letter-spacing:.06em;white-space:nowrap;cursor:url(./clef-cursor.png) 12 44, pointer}
.fg .fgk span:first-child{font-family:'Times New Roman',Times,serif;font-size:16px;letter-spacing:0;margin-right:9px;display:inline-block;min-width:16px}
.fg .lab{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:.1em;text-transform:uppercase}

.fg .fgn{position:absolute;margin:0;font-size:10.5px;letter-spacing:.06em;white-space:nowrap;transition:left .65s cubic-bezier(.32,.72,0,1),top .65s cubic-bezier(.32,.72,0,1);pointer-events:none;z-index:25}
.fg .fgn span{font-family:'Times New Roman',Times,serif;font-size:14px;letter-spacing:0;margin-right:7px}
.fg .fgp .ph{width:100%;height:100%;background:#8E8A82;display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;font-size:6.5px;letter-spacing:.1em;text-transform:uppercase;color:#111111}

      const wd = row.map(j => j === k - 1 ? bw : G[j].w * SO);
      const tot = wd.reduce((a, b) => a + b, 0) + GAP * (row.length - 1);
      const kp = row.indexOf(k - 1), before = wd.slice(0, kp).reduce((a, b) => a + b, 0) + GAP * kp;
      let x0 = cl(K.x + K.w / 2 - bw / 2 - before, 0, C.FW - tot); bx = x0 + before + bw / 2;
      let x = x0; row.forEach((j, q) => { pack[j] = x + wd[q] / 2; x += wd[q] + GAP; });
      by = K.y + K.h / 2;
    }
    G.forEach((g, j) => {
      const i = j + 1, cx = g.x + g.w / 2, cy = g.y + g.h / 2;
      let s = 1, tx = 0, ty = 0, z = 2;
      if (k === i) { s = bw / g.w; tx = bx - cx; ty = by - cy; z = 20; }
      else if (k && C.mode === 'grid') {
        s = 0.72;
        if (pack[j] !== undefined) { tx = pack[j] - cx; }
        else { const K = G[k - 1]; ty = Math.sign(g.r - K.r) * ((bh - K.h) / 2 + 12); }
      }
      else if (k) {
        if (C.mode === 'stage') { s = 0.88; }
        else if (C.mode === 'dock') {
          const K = G[k - 1];
          if (g.r === K.r) { const vx = cx - bx, d = Math.abs(vx) || 1; s = 1 - 0.3 * Math.exp(-d / 320);
            tx = Math.sign(vx || 1) * (Math.max(0, bw / 2 + g.w * s / 2 + 22 - d) + 28 * Math.exp(-d / 300)); }
          else { s = 0.86; if (Math.abs(cx - bx) < bw / 2 + g.w / 2) { const vy = cy - by; ty = Math.sign(vy) * Math.max(0, bh / 2 + g.h * s / 2 + 18 - Math.abs(vy)); } }
        } else {
          const ox = C.mode === 'center' ? C.CX : bx, oy = C.mode === 'center' ? C.CY : by;
          const vx = cx - ox, vy = cy - oy, d = Math.hypot(vx, vy) || 1;
          const m = Math.max(0, Math.hypot(bw, bh) / 2 + Math.hypot(g.w, g.h) * 0.36 + 20 - d) + (C.mode === 'center' ? 80 : 46) * Math.exp(-d / 420);
          s = 0.8; tx = vx / d * m; ty = vy / d * m;
        }
        tx = cl(cx + tx, g.w * s / 2, C.FW - g.w * s / 2) - cx;
      }
      o['t' + i] = 'translate(' + tx.toFixed(1) + 'px, ' + ty.toFixed(1) + 'px) scale(' + s.toFixed(3) + ')';
      o['z' + i] = z; o['sh' + i] = (k === i && !g.c) ? '0 30px 80px rgba(17,17,17,0.28)' : '0 0 0 rgba(17,17,17,0)';
      o['bx' + i] = (cx + tx - g.w * s / 2).toFixed(1); o['by' + i] = (cy + ty + g.h * s / 2 + 8).toFixed(1);
      o['in' + i] = () => {
        this.setState({ hov: i });
        const v = (this.vids || {})[i]; if (!v) return;
        v.currentTime = 0; v.muted = false;
        const p = v.play();
        if (p && p.catch) p.catch(() => { v.muted = true; v.play(); this.setState({ hush: true }); });
      };
      o['ck' + i] = () => { const v = (this.vids || {})[i]; if (v) { v.muted = false; v.play(); } this.setState({ hush: false }); };
      o['vr' + i] = (el) => { this.vids = this.vids || {}; this.vids[i] = el; };
    });
    o.hushLab = this.state.hush ? 'click once for sound' : '';
    o.stageLab = k ? '' : 'hover one';
    o.out = () => { const v = (this.vids || {})[this.state.hov]; if (v) v.pause(); this.setState({ hov: 0 }); };
    return o;
  }
  renderVals() {
    const f = this.state.flipped;
    return {
      ...this.fg(),
      leafDeg: f ? -180 : 0,
      turnLabel: f ? '‹ turn back' : 'turn the page ›',
      flip: () => this.setState({ flipped: !f }),
      stop: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },
    };
  }
}

</script>
